spring:
  application:
    name: poplot-backend

  profiles:
    default: local

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

qr-ticket:
  secret: ${QR_TICKET_SECRET:${jwt.secret}}

oauth:
  kakao:
    enabled: ${KAKAO_OAUTH_ENABLED:false}
    base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    app-id: ${KAKAO_APP_ID:0}
    connect-timeout: ${KAKAO_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${KAKAO_API_READ_TIMEOUT:3s}
  apple:
    enabled: ${APPLE_OAUTH_ENABLED:false}
    base-url: ${APPLE_API_BASE_URL:https://appleid.apple.com}
    client-id: ${APPLE_CLIENT_ID:}
    issuer: https://appleid.apple.com
    connect-timeout: ${APPLE_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${APPLE_API_READ_TIMEOUT:3s}
    public-key-cache-ttl: ${APPLE_PUBLIC_KEY_CACHE_TTL:1h}
    clock-skew-seconds: ${APPLE_CLOCK_SKEW_SECONDS:30}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-NO_TRACE}] [%thread] %logger{36} - %msg%n"
