# ---------------------------------------------------------------- #
# CodeRabbit AI 설정
# ---------------------------------------------------------------- #

language: "ko-KR"

tone_instructions: >
  명확하고 교육적으로 리뷰하세요. 스타일보다 데이터 정합성, 트랜잭션,
  동시성, 성능, 보안을 우선하고 원인과 개선 방법을 함께 제시하세요.
  명확한 필요가 없는 추상화나 계층 추가는 제안하지 마세요.

# ---------------------------------------------------------------- #
# 코드 리뷰
# ---------------------------------------------------------------- #

reviews:
  profile: "chill"

  request_changes_workflow: false

  high_level_summary: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true

  assess_linked_issues: true
  related_issues: false
  related_prs: true

  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  poem: true

  # -------------------------------------------------------------- #
  # 정적 분석
  # -------------------------------------------------------------- #

  tools:
    github-checks:
      enabled: true

  # -------------------------------------------------------------- #
  # Controller
  # -------------------------------------------------------------- #

  path_instructions:
    - path: "src/main/java/com/poplot/feature/**/controller/**"
      instructions: |
        - Controller는 HTTP 요청/응답 처리와 Service 호출에 집중하는지 확인하세요.
        - Controller에 비즈니스 로직이나 Repository 직접 접근이 포함되지 않았는지 확인하세요.
        - 요청 DTO에 필요한 Bean Validation이 적용되어 있는지 확인하세요.
        - 인증 및 인가가 필요한 API에서 권한 검증이 누락되지 않았는지 확인하세요.
        - HTTP Method와 Status Code가 API 의미에 적절한지 확인하세요.
        - JPA Entity를 API 요청 또는 응답 모델로 직접 사용하지 않는지 확인하세요.
        - 예약, 취소, 체크인처럼 중복 요청 가능성이 높은 API에서는 멱등성 문제가 없는지 확인하세요.

    # ------------------------------------------------------------ #
    # DTO
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/feature/**/dto/**"
      instructions: |
        - 요청 DTO의 필수값과 null 허용 여부가 실제 API 계약과 일치하는지 확인하세요.
        - 문자열 길이, 숫자 범위, 인원 수, 날짜/시간 등 필요한 입력 검증이 존재하는지 확인하세요.
        - Entity를 API DTO 대신 직접 사용하는 코드가 없는지 확인하세요.
        - 내부 구현 정보, 인증 정보 또는 민감 정보가 응답 DTO에 노출되지 않는지 확인하세요.
        - request DTO와 response DTO의 책임이 불필요하게 혼합되지 않았는지 확인하세요.

    # ------------------------------------------------------------ #
    # Entity
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/feature/**/entity/**"
      instructions: |
        - JPA Entity의 기본 생성자 접근 수준과 Hibernate proxy 생성 조건이 올바른지 확인하세요.
        - Java 필드의 null 허용 여부와 DB NOT NULL 제약 조건이 일치하는지 확인하세요.
        - JPA 연관관계의 owning side가 올바르게 설정되어 있는지 확인하세요.
        - 양방향 연관관계가 실제 필요 없이 사용되지 않았는지 확인하세요.
        - CascadeType.ALL 또는 orphanRemoval이 예상하지 못한 데이터 변경이나 삭제를 만들 가능성이 없는지 확인하세요.
        - equals/hashCode 구현이 식별자 생성 전략이나 Hibernate proxy와 충돌하지 않는지 확인하세요.
        - Entity 상태 변경을 외부 setter로 무분별하게 허용하고 있지 않은지 확인하세요.
        - 예약 상태, 대기 상태, 체크인 상태 등의 상태 전이가 유효한 순서로만 가능하도록 보호되는지 확인하세요.
        - UNIQUE, NOT NULL, FOREIGN KEY 등 DB 제약으로 보장해야 하는 도메인 불변식이 애플리케이션 검증에만 의존하고 있지 않은지 확인하세요.

    # ------------------------------------------------------------ #
    # Repository
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/feature/**/repository/**"
      instructions: |
        - N+1 문제가 발생할 가능성이 있는지 확인하세요.
        - Entity 전체를 조회한 뒤 애플리케이션에서 불필요하게 필터링하거나 집계하지 않는지 확인하세요.
        - 존재 여부만 필요한 경우 전체 Entity 조회 대신 exists query를 사용할 수 있는지 확인하세요.
        - 필요한 컬럼만 조회하면 되는 경우 Projection 사용이 더 적절한지 검토하세요.
        - 대량 데이터 조회에 Pagination 또는 명시적인 조회 범위 제한이 존재하는지 확인하세요.
        - WHERE, JOIN, ORDER BY 조건과 PostgreSQL 인덱스 구조가 적절하게 대응되는지 확인하세요.
        - 예약 잔여 인원, 대기열 순번 등 동시성이 중요한 데이터를 조회하고 갱신하는 경우 locking 또는 원자적 갱신이 필요한지 확인하세요.
        - JPQL 또는 Native Query 사용 시 PostgreSQL 17에서의 동작과 성능 문제를 확인하세요.
        - 불필요한 fetch join이나 다중 collection fetch로 인해 Cartesian Product가 발생하지 않는지 확인하세요.

    # ------------------------------------------------------------ #
    # Service
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/feature/**/service/**"
      instructions: |
        - Service가 유스케이스와 트랜잭션 처리에 집중하는지 확인하세요.
        - 트랜잭션 경계가 실제 비즈니스 작업 단위와 일치하는지 확인하세요.
        - 조회 전용 로직에서는 readOnly 트랜잭션 적용 여부를 검토하세요.
        - 외부 API, 메시지 큐, Redis 등 네트워크 I/O가 DB 트랜잭션을 불필요하게 길게 유지하지 않는지 확인하세요.
        - 예약 생성, 예약 취소, 대기열 처리 및 체크인 과정에서 race condition이 발생할 가능성이 없는지 확인하세요.
        - lost update, duplicate reservation, overselling, duplicate check-in 가능성을 우선적으로 확인하세요.
        - 조회 후 검증 후 수정하는 read-check-write 패턴이 동시 요청 환경에서 안전한지 확인하세요.
        - 동일 사용자의 동일 이벤트 또는 동일 시간대 중복 예약이 방지되는지 확인하세요.
        - 동일 QR 또는 동일 예약의 중복 체크인이 방지되는지 확인하세요.
        - 애플리케이션 레벨 검증만으로 핵심 데이터 무결성을 보장하려는 코드가 없는지 확인하세요.
        - 트랜잭션 실패 후 외부 시스템 상태와 DB 상태가 불일치할 가능성이 있는지 확인하세요.
        - 예외를 지나치게 광범위하게 catch하거나 원인을 숨기고 있지 않은지 확인하세요.

    # ------------------------------------------------------------ #
    # Port
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/feature/**/port/**"
      instructions: |
        - Port가 Redis, SQS, HTTP 같은 기술 이름이 아니라 비즈니스가 요구하는 기능을 표현하는 인터페이스인지 확인하세요.
        - 단순 JPA CRUD까지 불필요하게 Port로 추상화하고 있지 않은지 확인하세요.
        - 구현 교체, 장애 격리, 테스트 대역 등 실제 추상화 이유가 존재하는지 확인하세요.
        - Redis Client, AWS SDK 등 Adapter 전용 라이브러리 타입이 Port 인터페이스에 노출되지 않는지 확인하세요.
        - Port의 책임이 지나치게 크거나 서로 다른 외부 시스템 책임이 하나의 인터페이스에 혼합되지 않았는지 확인하세요.

    # ------------------------------------------------------------ #
    # Adapter
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/feature/**/adapter/**"
      instructions: |
        - Adapter가 Port 구현과 외부 시스템 연동 책임에 집중하는지 확인하세요.
        - Redis, 메시지 큐, 외부 API 장애가 핵심 DB 트랜잭션까지 불필요하게 전파되지 않는지 확인하세요.
        - timeout 정책이 필요한 외부 연동에 timeout이 누락되지 않았는지 확인하세요.
        - retry 정책 사용 시 동일 작업이 중복 수행되어도 안전한지 확인하세요.
        - 메시지 큐 사용 시 at-least-once delivery에 따른 중복 처리가 고려되어 있는지 확인하세요.
        - 외부 시스템 장애 시 fallback 또는 실패 정책이 비즈니스 요구사항과 일치하는지 확인하세요.
        - 외부 기술 세부사항이 Service 계층으로 누출되지 않는지 확인하세요.

    # ------------------------------------------------------------ #
    # Feature Exception
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/feature/**/exception/**"
      instructions: |
        - 예외 이름과 오류 코드가 실제 비즈니스 실패 상황을 명확하게 표현하는지 확인하세요.
        - 동일한 의미의 예외가 feature 내부에서 중복 정의되지 않았는지 확인하세요.
        - 시스템 예외와 사용자의 잘못된 요청으로 인한 비즈니스 예외를 구분하고 있는지 확인하세요.
        - 내부 구현 정보나 하위 라이브러리 예외가 API 계층까지 그대로 노출되지 않는지 확인하세요.

    # ------------------------------------------------------------ #
    # Security
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/global/security/**"
      instructions: |
        - JWT 서명 검증과 만료 검증이 올바르게 수행되는지 확인하세요.
        - 인증되지 않은 사용자 입력이나 JWT claim을 검증 없이 신뢰하지 않는지 확인하세요.
        - 인증이 필요한 endpoint가 permitAll로 잘못 노출되지 않았는지 확인하세요.
        - 권한 검증이 필요한 기능에서 단순 인증 여부만 확인하고 있지 않은지 확인하세요.
        - 사용자 ID를 요청 body 또는 path parameter만으로 신뢰해 다른 사용자의 데이터를 조작할 수 있는 문제가 없는지 확인하세요.
        - JWT secret, access token, refresh token 등 민감 정보가 로그에 기록되지 않는지 확인하세요.
        - Stateless Security 설정과 HTTP Session 기반 상태 관리가 의도치 않게 혼용되지 않는지 확인하세요.
        - 인증 실패와 인가 실패에 적절한 HTTP 상태가 반환되는지 확인하세요.

    # ------------------------------------------------------------ #
    # Global Exception
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/global/exception/**"
      instructions: |
        - 예외가 적절한 HTTP Status와 서비스 오류 코드로 변환되는지 확인하세요.
        - API 오류 응답이 프로젝트 공통 응답 형식을 일관되게 따르는지 확인하세요.
        - SQL 오류, stack trace, 내부 클래스명 등 구현 정보가 클라이언트에 노출되지 않는지 확인하세요.
        - Exception 또는 RuntimeException을 지나치게 광범위하게 처리하여 실제 오류가 숨겨지지 않는지 확인하세요.
        - 예상하지 못한 서버 오류와 비즈니스 오류를 명확하게 구분하는지 확인하세요.

    # ------------------------------------------------------------ #
    # Logging
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/global/logging/**"
      instructions: |
        - JWT, 개인정보, 인증 정보 등 민감 데이터가 로그에 기록되지 않는지 확인하세요.
        - X-Request-Id가 요청 흐름 전체에서 일관되게 유지되는지 확인하세요.
        - 장애 분석에 필요한 context가 누락되지 않았는지 확인하세요.
        - 정상적인 고빈도 요청에 과도한 INFO 로그를 남겨 로그 비용과 가독성을 저하시키지 않는지 확인하세요.
        - 예외 stack trace가 중복으로 여러 계층에서 기록되지 않는지 확인하세요.

    # ------------------------------------------------------------ #
    # Configuration
    # ------------------------------------------------------------ #

    - path: "src/main/java/com/poplot/global/config/**"
      instructions: |
        - 운영 환경에서 안전하지 않은 기본값이나 fallback 설정이 존재하지 않는지 확인하세요.
        - secret 또는 credential이 코드에 하드코딩되지 않았는지 확인하세요.
        - local, test, prod 환경 설정이 의도치 않게 혼합되지 않는지 확인하세요.
        - 운영 환경에서 개발 편의 기능이나 과도한 endpoint가 활성화되지 않는지 확인하세요.

    # ------------------------------------------------------------ #
    # Flyway Migration
    # ------------------------------------------------------------ #

    - path: "src/main/resources/db/migration/**"
      instructions: |
        - PostgreSQL 17에서 실행 가능한 SQL인지 확인하세요.
        - 운영 데이터가 이미 존재하는 상태에서도 안전하게 적용 가능한 migration인지 확인하세요.
        - 이미 적용된 기존 Flyway migration 파일을 수정하고 있지 않은지 확인하세요.
        - migration version이 중복되거나 실행 순서가 잘못되지 않았는지 확인하세요.
        - NOT NULL, UNIQUE, FOREIGN KEY 추가 시 기존 데이터와 충돌할 가능성을 확인하세요.
        - 예약 중복, 슬롯 정원 등 핵심 도메인 불변식을 DB Constraint로 보장할 수 있는지 검토하세요.
        - ALTER TABLE이 대용량 테이블에서 긴 lock을 발생시킬 가능성이 있는지 확인하세요.
        - CREATE INDEX가 운영 환경에서 장시간 lock 또는 높은 부하를 발생시킬 가능성이 있는지 확인하세요.
        - 주요 조회 조건과 ORDER BY에 필요한 인덱스가 존재하는지 확인하세요.
        - 컬럼 순서를 포함하여 복합 인덱스가 실제 조회 패턴에 적합한지 확인하세요.
        - 불필요하거나 기존 인덱스와 중복되는 인덱스를 생성하지 않는지 확인하세요.

    # ------------------------------------------------------------ #
    # Test
    # ------------------------------------------------------------ #

    - path: "src/test/java/**"
      instructions: |
        - 정상 케이스뿐 아니라 실패 케이스와 경계값 테스트가 존재하는지 확인하세요.
        - 예약, 취소, 대기, 체크인처럼 상태 전이가 있는 기능은 잘못된 상태 전이에 대한 테스트가 존재하는지 확인하세요.
        - 정원 0명, 정확히 마지막 자리, 정원 초과 등 경계값 테스트가 존재하는지 확인하세요.
        - 동일 사용자의 중복 예약에 대한 테스트가 존재하는지 확인하세요.
        - 동일 QR 또는 동일 예약의 중복 체크인 테스트가 존재하는지 확인하세요.
        - 동시성 제어 코드 변경 시 실제 병렬 요청을 사용하는 동시성 테스트가 필요한지 확인하세요.
        - Mock을 과도하게 사용하여 실제 DB Constraint나 Transaction 동작을 검증하지 못하고 있지 않은지 확인하세요.
        - PostgreSQL에 의존하는 SQL, lock, transaction, constraint 동작을 H2 테스트만으로 검증하고 있지 않은지 확인하세요.
        - 테스트가 구현 세부사항보다 외부에서 관찰 가능한 동작을 검증하는지 확인하세요.

  # -------------------------------------------------------------- #
  # 자동 리뷰
  # -------------------------------------------------------------- #

  auto_review:
    enabled: true
    auto_incremental_review: true

    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip review]"

# ---------------------------------------------------------------- #
# 채팅
# ---------------------------------------------------------------- #

chat:
  auto_reply: true

# ---------------------------------------------------------------- #
# Knowledge Base
# ---------------------------------------------------------------- #

knowledge_base:
  web_search:
    enabled: true

  code_guidelines:
    enabled: true
